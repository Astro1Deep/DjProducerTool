<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#13192f"/>
      <stop offset="45%" stop-color="#080b15"/>
      <stop offset="100%" stop-color="#020306"/>
    </radialGradient>
    <radialGradient id="glow-left-cyan" cx="12%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-right-magenta" cx="88%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon-cyan-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="45%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
    <linearGradient id="wax-flame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffdd00"/>
      <stop offset="50%" stop-color="#ff4400"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>
    <linearGradient id="border-cell-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0066ff" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="border-cell-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffaa00" stop-opacity="0.25"/>
    </linearGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="500" fill="url(#bg-glow)"/>
  <rect width="1600" height="500" fill="url(#glow-left-cyan)"/>
  <rect width="1600" height="500" fill="url(#glow-right-magenta)"/>

  <!-- Subtle Vinyl Grooves & Frequency Grid Lines -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="85" x2="1600" y2="85"/>
    <line x1="0" y1="170" x2="1600" y2="170"/>
    <line x1="0" y1="255" x2="1600" y2="255"/>
    <line x1="0" y1="340" x2="1600" y2="340"/>
    <line x1="0" y1="425" x2="1600" y2="425"/>
  </g>
  <g opacity="0.08" stroke="#00f0ff" stroke-width="1.2" fill="none">
    <circle cx="120" cy="250" r="210"/>
    <circle cx="120" cy="250" r="260"/>
    <circle cx="1480" cy="250" r="210" stroke="#ff007f"/>
    <circle cx="1480" cy="250" r="260" stroke="#ff007f"/>
  </g>

  <!-- ========================================================================= -->
  <!-- CELDA IZQUIERDA: ASTRO1DEEP (Vectorial Puro - Nítido Infinito en Retina)  -->
  <!-- ========================================================================= -->
  <g transform="translate(55, 85)">
    <!-- Marco Cyberpunk de Celda -->
    <rect x="0" y="0" width="170" height="270" rx="24" fill="#080c17" fill-opacity="0.9" stroke="url(#border-cell-left)" stroke-width="1.8" filter="url(#glow)"/>
    
    <!-- Status Chip Celda -->
    <circle cx="28" cy="30" r="3.5" fill="#00f0ff" filter="url(#glow-subtle)"/>
    <text x="40" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" letter-spacing="2" fill="#00f0ff" opacity="0.9">ARTIST</text>

    <!-- Símbolo Vectorial Puro: Astro1Deep Eye with Tear (Sharp, Infinite Resolution) -->
    <g transform="translate(85, 120)">
      <!-- Ojo Exterior Blanco -->
      <path d="M-55,0 C-30,-42 30,-42 55,0 C30,42 -30,42 -55,0 Z" fill="#ffffff" filter="url(#glow-subtle)"/>
      <!-- Iris Interior Oscuro -->
      <ellipse cx="0" cy="0" rx="16" ry="16" fill="#080c17"/>
      <!-- Pupila Cian Neón -->
      <circle cx="0" cy="0" r="7" fill="#00f0ff" filter="url(#glow-subtle)"/>
      <!-- Lágrima Icónica -->
      <path d="M0,28 C-12,50 -13,68 0,80 C13,68 12,50 0,28 Z" fill="#ffffff" filter="url(#glow-subtle)"/>
    </g>

    <!-- Textos de Celda -->
    <text x="85" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" letter-spacing="3" fill="#ffffff" text-anchor="middle">ASTRO1DEEP</text>
    <text x="85" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" letter-spacing="2" fill="#64748b" text-anchor="middle">IDENTITY</text>
  </g>

  <!-- ========================================================================= -->
  <!-- SECCIÓN CENTRAL PRIORITARIA: MÁXIMO ESPACIO PARA MENÚS Y CONTENIDOS      -->
  <!-- ========================================================================= -->
  <g transform="translate(265, 75)">
    <!-- Top Pill Badges -->
    <g transform="translate(0, 18)">
      <rect x="0" y="-18" width="150" height="28" rx="14" fill="#ff007f" fill-opacity="0.18" stroke="#ff007f" stroke-width="1.2"/>
      <text x="16" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="2" fill="#ff007f">WAXSPACESHIP</text>
      <text x="168" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#00f0ff">CEREBRO OS NATIVE MODULE</text>
    </g>

    <!-- Título Principal -->
    <text x="0" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" letter-spacing="-1.5" fill="#ffffff">
      DJProducerTools <tspan fill="url(#neon-cyan-pink)">v1.3.0</tspan>
    </text>

    <!-- Subtítulo Descriptivo -->
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#94a3b8" letter-spacing="0.4">
      The Eclectic macOS Audio Engineering Suite &amp; Resilient Acoustic Core
    </text>

    <!-- Fila de Menús / Chips del Ecosistema (Ampliados y con Máxima Prioridad) -->
    <g transform="translate(0, 175)">
      <!-- Tag 1: Cerebro OS -->
      <g transform="translate(0, 0)">
        <rect width="205" height="38" rx="10" fill="#0b1424" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="18" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">🧠 Cerebro OS Native</text>
      </g>
      <!-- Tag 2: ShazamIO Core -->
      <g transform="translate(222, 0)">
        <rect width="215" height="38" rx="10" fill="#1c1606" stroke="#eab308" stroke-width="1.5"/>
        <text x="18" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#fbbf24">⚡ ShazamIO Resilient</text>
      </g>
      <!-- Tag 3: MPC Sample DB -->
      <g transform="translate(454, 0)">
        <rect width="215" height="38" rx="10" fill="#1c0a15" stroke="#f43f5e" stroke-width="1.5"/>
        <text x="18" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#fb7185">🎛️ MPC Sample DB</text>
      </g>
      <!-- Tag 4: Serato · Ableton -->
      <g transform="translate(686, 0)">
        <rect width="225" height="38" rx="10" fill="#170a24" stroke="#a855f7" stroke-width="1.5"/>
        <text x="18" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#c084fc">🎧 Serato · Ableton Live</text>
      </g>
    </g>

    <!-- Barra de Estado Inferior -->
    <g transform="translate(0, 252)" opacity="0.95">
      <circle cx="7" cy="-5" r="4.5" fill="#10b981" filter="url(#glow-subtle)"/>
      <text x="22" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500" fill="#64748b">
        Auditoría 100% OK · 219 Python Files · 77 Shell Scripts · Multi-Disk Architecture (MicroSD / SSD / Samsung / Realtek)
      </text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- CELDA DERECHA: WAXSPACESHIP (Vectorial Puro - Nítido Infinito en Retina)  -->
  <!-- ========================================================================= -->
  <g transform="translate(1375, 85)">
    <!-- Marco Cyberpunk Celda Gemela -->
    <rect x="0" y="0" width="170" height="270" rx="24" fill="#120815" fill-opacity="0.9" stroke="url(#border-cell-right)" stroke-width="1.8" filter="url(#glow)"/>
    
    <!-- Status Chip Celda -->
    <circle cx="28" cy="30" r="3.5" fill="#ff007f" filter="url(#glow-subtle)"/>
    <text x="40" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" letter-spacing="2" fill="#ff007f" opacity="0.9">IMPRINT</text>

    <!-- Símbolo Vectorial Puro: WaxSpaceship Cosmic Rocket (Sharp, Infinite Resolution) -->
    <g transform="translate(85, 120)">
      <!-- Fuselaje Central del Cohete -->
      <path d="M0,-52 C18,-24 22,12 16,38 L-16,38 C-22,12 -18,-24 0,-52 Z" fill="#ffffff" filter="url(#glow-subtle)"/>
      <!-- Cabina / Ventana Neón -->
      <circle cx="0" cy="-12" r="9" fill="#080c17"/>
      <circle cx="0" cy="-12" r="5" fill="#ff007f" filter="url(#glow-subtle)"/>
      
      <!-- Aletas Laterales Aerodinámicas -->
      <path d="M-16,15 C-38,26 -40,50 -28,50 L-14,36 Z" fill="#ffffff" filter="url(#glow-subtle)"/>
      <path d="M16,15 C38,26 40,50 28,50 L14,36 Z" fill="#ffffff" filter="url(#glow-subtle)"/>
      
      <!-- Propulsión de Cera Líquida / Fuego Fundido -->
      <path d="M-8,40 C-6,58 -2,68 0,72 C2,68 6,58 8,40 Z" fill="url(#wax-flame)" filter="url(#glow-subtle)"/>
      <ellipse cx="-18" cy="56" rx="2.5" ry="4" fill="#ffaa00"/>
      <ellipse cx="18" cy="56" rx="2.5" ry="4" fill="#ffaa00"/>
      <ellipse cx="0" cy="78" rx="2" ry="3" fill="#ffdd00"/>
    </g>

    <!-- Textos de Celda -->
    <text x="85" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="2" fill="#ffffff" text-anchor="middle">WAXSPACESHIP</text>
    <text x="85" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" letter-spacing="2" fill="#64748b" text-anchor="middle">LABEL CORE</text>
  </g>

  <!-- Borde Superior e Inferior Acentuado Neón -->
  <line x1="0" y1="0" x2="1600" y2="0" stroke="url(#neon-cyan-pink)" stroke-width="3.5"/>
  <line x1="0" y1="498" x2="1600" y2="498" stroke="url(#neon-cyan-pink)" stroke-width="2.5" opacity="0.7"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="60%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#14182b"/>
      <stop offset="45%" stop-color="#0a0c16"/>
      <stop offset="100%" stop-color="#040508"/>
    </radialGradient>
    <radialGradient id="cyber-glow-cyan" cx="25%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyber-glow-magenta" cx="75%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon-cyan-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
    <linearGradient id="wax-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffdd00"/>
      <stop offset="50%" stop-color="#ff8800"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" fill="url(#bg-glow)"/>
  <rect width="1200" height="420" fill="url(#cyber-glow-cyan)"/>
  <rect width="1200" height="420" fill="url(#cyber-glow-magenta)"/>

  <!-- Vinyl Grooves / Waveform Grid Pattern -->
  <g opacity="0.12" stroke="#00f0ff" stroke-width="1" fill="none">
    <circle cx="240" cy="210" r="180"/>
    <circle cx="240" cy="210" r="230"/>
    <circle cx="240" cy="210" r="280"/>
    <circle cx="240" cy="210" r="330"/>
    <circle cx="240" cy="210" r="380"/>
  </g>
  <g opacity="0.08" stroke="#ffffff" stroke-width="0.8">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
  </g>

  <!-- Embedded Branding Logos (Vectorized Icons & Silhouettes) -->
  <g transform="translate(90, 80)">
    <!-- Outer Floating Neon Hex / Vinyl Frame -->
    <rect x="-10" y="-10" width="260" height="260" rx="32" fill="#0d111d" fill-opacity="0.85" stroke="url(#neon-cyan-pink)" stroke-width="1.8" filter="url(#glow-filter)"/>
    
    <!-- Astro1Deep Eye with Tear Motif -->
    <g transform="translate(120, 65)">
      <!-- Eye -->
      <path d="M-60 0 Q0 -36 60 0 Q0 36 -60 0 Z" fill="#ffffff" filter="url(#glow-filter)"/>
      <ellipse cx="0" cy="0" rx="14" ry="14" fill="#0d111d"/>
      <circle cx="0" cy="0" r="6" fill="#00f0ff"/>
      <!-- Tear drop -->
      <path d="M0 24 C-10 40 -12 55 0 65 C12 55 10 40 0 24 Z" fill="#ffffff" filter="url(#glow-filter)"/>
    </g>

    <!-- Label Underneath Icon -->
    <text x="120" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#00f0ff" text-anchor="middle">ASTRO1DEEP</text>
    <text x="120" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="2" fill="#8892b0" text-anchor="middle">OFFICIAL ARTIST IDENTITY</text>
  </g>

  <!-- Central & Right Typography / Content Section -->
  <g transform="translate(390, 85)">
    <!-- Label Header -->
    <g transform="translate(0, 20)">
      <rect x="0" y="-16" width="135" height="24" rx="12" fill="#ff007f" fill-opacity="0.18" stroke="#ff007f" stroke-width="1"/>
      <text x="12" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" letter-spacing="2" fill="#ff007f">WAXSPACESHIP</text>
      <text x="148" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="3" fill="#64748b">IMPRINT &amp; SOUND LAB</text>
    </g>

    <!-- Main Title: DJProducerTools -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="-1" fill="#ffffff">
      DJProducerTools <tspan fill="url(#neon-cyan-pink)">v1.3.0</tspan>
    </text>

    <!-- Subtitle: Suite Description -->
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#94a3b8" letter-spacing="0.5">
      The Eclectic macOS Audio Engineering Suite &amp; Resilient Acoustic Core
    </text>

    <!-- System Tags & Ecosystem Connection -->
    <g transform="translate(0, 160)">
      <!-- Tag 1: Cerebro OS -->
      <g transform="translate(0, 0)">
        <rect width="130" height="28" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
        <text x="14" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">🧠 Cerebro OS</text>
      </g>
      <!-- Tag 2: MPC Sample DB -->
      <g transform="translate(142, 0)">
        <rect width="165" height="28" rx="6" fill="#0f172a" stroke="#f43f5e" stroke-width="1.2"/>
        <text x="14" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f43f5e">🎛️ MPC Sample DB</text>
      </g>
      <!-- Tag 3: ShazamIO Resilient -->
      <g transform="translate(319, 0)">
        <rect width="165" height="28" rx="6" fill="#0f172a" stroke="#eab308" stroke-width="1.2"/>
        <text x="14" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#eab308">⚡ ShazamIO Core</text>
      </g>
      <!-- Tag 4: Serato / Ableton -->
      <g transform="translate(496, 0)">
        <rect width="170" height="28" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
        <text x="14" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#c084fc">🎧 Serato · Ableton</text>
      </g>
    </g>

    <!-- Bottom Metadata Bar -->
    <g transform="translate(0, 225)" opacity="0.85">
      <circle cx="6" cy="-4" r="3" fill="#10b981"/>
      <text x="18" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">
        Auditoría 100% OK · 219 Python Files · 77 Shell Scripts · Multi-Disk Architecture (MicroSD / SSD / Samsung / Realtek)
      </text>
    </g>
  </g>

  <!-- Border Accent Lines -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#neon-cyan-pink)" stroke-width="3"/>
  <line x1="0" y1="418" x2="1200" y2="418" stroke="url(#neon-cyan-pink)" stroke-width="2" opacity="0.6"/>
</svg>
